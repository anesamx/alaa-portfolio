<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alaa's Art Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Lato:wght@400;700&family=Story+Script&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              'lato': ['"Lato"', 'sans-serif'],
              'playfair': ['"Playfair Display"', 'serif'],
              'story-script': ['"Story Script"', 'cursive'],
            },
            keyframes: {
              float: {
                '0%': { transform: 'translateY(0) translateX(0) rotate(0deg)', opacity: '0.7' },
                '25%': { transform: 'translateY(-30px) translateX(20px) rotate(45deg)', opacity: '1' },
                '50%': { transform: 'translateY(20px) translateX(-30px) rotate(-90deg)', opacity: '0.8' },
                '75%': { transform: 'translateY(-20px) translateX(30px) rotate(180deg)', opacity: '1' },
                '100%': { transform: 'translateY(0) translateX(0) rotate(360deg)', opacity: '0.7' },
              },
            },
          }
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
